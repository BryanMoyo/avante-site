<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avante CEIC</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        img {
            width: 100%;
            max-width: 500px;
            height: auto;
            display: block;
            margin: 0 auto 35px;
        }

        .paragraph {
            font-family: "Cormorant Garamond", serif;
            font-weight: 300;
            font-size: 22px;
            line-height: 1.6;
            color: #324158;
            margin: 0 auto;
            max-width: 750px;
        }

        .highlight {
            color: #083c85;
            font-weight: 700;
        }

        .email {
            margin-top: 45px;
            font-family: Arial, sans-serif; /* More reliable than Futura */
            font-size: 18px;
            font-weight: 700;
            color: #083c85;
            letter-spacing: 0.5px;
        }

        .email a {
            color: inherit;
            text-decoration: none;
        }

        .email a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <img src="your-image.png" alt="Avante CEIC Logo">

    <p class="paragraph">
        <span class="highlight">Avante CEIC Limited</span> is a privately owned investment holding company focused on long-term investments that enhance lives and drive sustainable development across emerging markets.
    </p>

    <p class="email">
        <a href="mailto:info@avanteceic.com">info@avanteceic.com</a>
    </p>

</div>

</body>
</html>
