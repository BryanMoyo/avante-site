<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Avante CEIC</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            /*
             * Adjust this value if the blue around the image
             * does not perfectly match the image background.
             */
            --brand-blue: #003f88;
            --text-blue: #083c85;
            --body-text: #324158;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--white);
            overflow-x: hidden;
        }

        /*
         * The section is taller than the screen so that the user
         * has enough scrolling distance to control the animation.
         */
        .scroll-intro {
            position: relative;
            height: 260vh;
            background: var(--white);
        }

        /*
         * This remains fixed in the viewport while the parent
         * section is being scrolled.
         */
        .scene {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: var(--brand-blue);
        }

        /*
         * The original white page sits behind the opening image.
         */
        .original-page {
            position: absolute;
            inset: 0;
            z-index: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 24px;
            background: var(--white);

            opacity: 0;
            transform: translateY(55px);
            pointer-events: none;
        }

        .page-content {
            width: min(900px, 100%);
            text-align: center;
        }

        .company-name {
            margin: 0 0 32px;

            font-family: "Cormorant Garamond", serif;
            font-size: clamp(58px, 9vw, 126px);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.055em;

            color: var(--text-blue);
        }

        .paragraph {
            max-width: 800px;
            margin: 0 auto;

            font-family: "Cormorant Garamond", serif;
            font-size: clamp(21px, 2.4vw, 31px);
            font-weight: 300;
            line-height: 1.45;

            color: var(--body-text);
        }

        .highlight {
            color: var(--text-blue);
            font-weight: 700;
        }

        .email {
            display: inline-block;
            margin-top: 48px;
            padding-bottom: 7px;

            font-family: "Montserrat", sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.06em;

            color: var(--text-blue);
            text-decoration: none;
            border-bottom: 1px solid rgba(8, 60, 133, 0.45);

            transition:
                opacity 250ms ease,
                border-color 250ms ease;
        }

        .email:hover {
            opacity: 0.65;
            border-color: var(--text-blue);
        }

        /*
         * Full-screen opening layer.
         */
        .opening-visual {
            position: absolute;
            inset: 0;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--brand-blue);
            transform-origin: center;
            will-change: opacity, background-color;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            display: block;

            object-fit: cover;
            object-position: center;

            transform-origin: center;
            will-change: transform, opacity;
            user-select: none;
            pointer-events: none;
        }

        /*
         * Small instruction visible only at the beginning.
         */
        .scroll-message {
            position: absolute;
            z-index: 3;
            bottom: 28px;
            left: 50%;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;

            transform: translateX(-50%);

            font-family: "Montserrat", sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.7);
            will-change: opacity;
        }

        .scroll-line {
            width: 1px;
            height: 42px;

            background: rgba(255, 255, 255, 0.55);

            animation: scrollPulse 1.8s ease-in-out infinite;
            transform-origin: top;
        }

        @keyframes scrollPulse {
            0%,
            100% {
                transform: scaleY(0.4);
                opacity: 0.35;
            }

            50% {
                transform: scaleY(1);
                opacity: 1;
            }
        }

        /*
         * Keeps the final white presentation visible after
         * the transformation has completed.
         */
        .ending-space {
            min-height: 35vh;
            background: var(--white);
        }

        @media (max-width: 700px) {
            .scroll-intro {
                height: 230vh;
            }

            .original-page {
                padding: 40px 22px;
            }

            .company-name {
                margin-bottom: 25px;
            }

            .paragraph {
                font-size: clamp(20px, 6vw, 27px);
            }

            .email {
                margin-top: 36px;
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .scroll-line {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main>

        <section class="scroll-intro" id="scrollIntro">

            <div class="scene" id="scene">

                <!-- Original white Avante page -->
                <div class="original-page" id="originalPage">

                    <div class="page-content">

                        <h1 class="company-name">
                            Avante CEIC
                        </h1>

                        <p class="paragraph">
                            <span class="highlight">
                                Avante CEIC Limited
                            </span>
                            is a privately owned investment holding company
                            focused on long-term investments that enhance lives
                            and drive sustainable development across emerging
                            markets.
                        </p>

                        <a
                            class="email"
                            href="mailto:info@avanteceic.com"
                        >
                            info@avanteceic.com
                        </a>

                    </div>

                </div>

                <!-- Full-screen Great Zimbabwe opening -->
                <div class="opening-visual" id="openingVisual">

                    <img
                        class="hero-image"
                        id="heroImage"
                        src="great-zimbabwe.png"
                        alt="Great Zimbabwe illustration"
                    >

                    <div class="scroll-message" id="scrollMessage">
                        <span>Scroll to enter</span>
                        <span class="scroll-line"></span>
                    </div>

                </div>

            </div>

        </section>

        <div class="ending-space"></div>

    </main>

    <script>
        const scrollIntro = document.getElementById("scrollIntro");
        const openingVisual = document.getElementById("openingVisual");
        const heroImage = document.getElementById("heroImage");
        const originalPage = document.getElementById("originalPage");
        const scrollMessage = document.getElementById("scrollMessage");

        const clamp = (number, minimum, maximum) => {
            return Math.min(Math.max(number, minimum), maximum);
        };

        const mapRange = (
            value,
            inputMinimum,
            inputMaximum,
            outputMinimum,
            outputMaximum
        ) => {
            const mapped =
                outputMinimum +
                (
                    (value - inputMinimum) /
                    (inputMaximum - inputMinimum)
                ) *
                (outputMaximum - outputMinimum);

            return clamp(
                mapped,
                Math.min(outputMinimum, outputMaximum),
                Math.max(outputMinimum, outputMaximum)
            );
        };

        /*
         * A smoother alternative to ordinary linear movement.
         */
        const easeInOut = (value) => {
            return value < 0.5
                ? 4 * value * value * value
                : 1 - Math.pow(-2 * value + 2, 3) / 2;
        };

        function updateAnimation() {
            const sectionTop = scrollIntro.offsetTop;
            const scrollDistance =
                scrollIntro.offsetHeight - window.innerHeight;

            const distanceScrolled = window.scrollY - sectionTop;

            const rawProgress = clamp(
                distanceScrolled / scrollDistance,
                0,
                1
            );

            /*
             * Image shrinking begins immediately.
             */
            const scaleProgress = easeInOut(
                mapRange(rawProgress, 0, 0.72, 0, 1)
            );

            const imageScale =
                1 - scaleProgress * 0.78;

            /*
             * Slight upward movement makes the transition feel
             * less static.
             */
            const imageY =
                mapRange(rawProgress, 0, 0.72, 0, -8);

            heroImage.style.transform =
                `translateY(${imageY}vh) scale(${imageScale})`;

            /*
             * Fade the blue image near the final part of the animation.
             */
            const imageOpacity =
                mapRange(rawProgress, 0.48, 0.82, 1, 0);

            openingVisual.style.opacity = imageOpacity;

            /*
             * Reveal the original white page while the image disappears.
             */
            const contentOpacity =
                mapRange(rawProgress, 0.52, 0.84, 0, 1);

            const contentY =
                mapRange(rawProgress, 0.52, 0.84, 55, 0);

            originalPage.style.opacity = contentOpacity;
            originalPage.style.transform =
                `translateY(${contentY}px)`;

            /*
             * Remove the scroll instruction quickly.
             */
            const messageOpacity =
                mapRange(rawProgress, 0, 0.13, 1, 0);

            scrollMessage.style.opacity = messageOpacity;

            /*
             * Prevent the invisible opening layer from blocking links.
             */
            openingVisual.style.pointerEvents =
                rawProgress > 0.82 ? "none" : "auto";

            originalPage.style.pointerEvents =
                rawProgress > 0.72 ? "auto" : "none";
        }

        let animationFrameRequested = false;

        function requestAnimationUpdate() {
            if (animationFrameRequested) {
                return;
            }

            animationFrameRequested = true;

            window.requestAnimationFrame(() => {
                updateAnimation();
                animationFrameRequested = false;
            });
        }

        window.addEventListener(
            "scroll",
            requestAnimationUpdate,
            { passive: true }
        );

        window.addEventListener(
            "resize",
            requestAnimationUpdate
        );

        updateAnimation();
    </script>

</body>
</html>
