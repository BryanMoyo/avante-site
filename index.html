<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Avante CEIC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            /* Exact blue from the Great Zimbabwe image */
            --brand-blue: #033b85;

            --text-blue: #083c85;
            --body-text: #324158;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            background: var(--white);
        }

        /*
         * Gives the scroll animation enough distance.
         */
        .scroll-intro {
            position: relative;
            height: 260vh;
            background: var(--white);
        }

        /*
         * Keeps the animation fixed in the viewport
         * while the user scrolls.
         */
        .scene {
            position: sticky;
            top: 0;

            width: 100%;
            height: 100vh;

            overflow: hidden;
            background: var(--brand-blue);
        }

        /*
         * The original white page underneath the intro.
         */
        .original-page {
            position: absolute;
            inset: 0;
            z-index: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 24px;

            background: var(--white);

            opacity: 0;
            transform: translateY(55px);

            pointer-events: none;
            will-change: opacity, transform;
        }

        .page-content {
            width: min(900px, 100%);
            text-align: center;
        }

        /*
         * This replaces the written "Avante CEIC" heading.
         */
        .avante-logo {
            display: block;

            width: min(500px, 80vw);
            max-height: 220px;
            height: auto;

            object-fit: contain;

            margin: 0 auto 35px;
        }

        .paragraph {
            max-width: 800px;
            margin: 0 auto;

            font-family: "Cormorant Garamond", serif;
            font-size: clamp(21px, 2.4vw, 31px);
            font-weight: 300;
            line-height: 1.45;

            color: var(--body-text);
        }

        .highlight {
            color: var(--text-blue);
            font-weight: 700;
        }

        .email {
            display: inline-block;

            margin-top: 46px;
            padding-bottom: 7px;

            font-family: "Montserrat", sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.06em;

            color: var(--text-blue);
            text-decoration: none;

            border-bottom:
                1px solid rgba(8, 60, 133, 0.45);

            transition:
                opacity 250ms ease,
                border-color 250ms ease,
                padding-bottom 250ms ease;
        }

        .email:hover {
            opacity: 0.68;
            border-color: var(--text-blue);
            padding-bottom: 11px;
        }

        /*
         * Full-screen blue opening layer.
         */
        .opening-visual {
            position: absolute;
            inset: 0;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            /*
             * This now matches the image blue exactly.
             */
            background: var(--brand-blue);

            will-change: opacity;
        }

        /*
         * Great Zimbabwe image.
         *
         * "contain" prevents it from being cropped.
         * The matching blue fills any remaining viewport space.
         */
        .hero-image {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 1;

            width: min(100vw, 100vh);
            height: min(100vw, 100vh);

            display: block;

            object-fit: contain;
            object-position: center;

            user-select: none;
            pointer-events: none;

            transform:
                translate(-50%, -50%)
                scale(1);

            transform-origin: center;
            will-change: transform;
        }

        /*
         * Always appears above the Great Zimbabwe image.
         */
        .scroll-message {
            position: absolute;
            left: 50%;
            bottom: 24px;
            z-index: 20;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;

            transform: translateX(-50%);

            font-family: "Montserrat", sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            white-space: nowrap;

            color: rgba(255, 255, 255, 0.95);

            text-shadow:
                0 2px 14px rgba(0, 0, 0, 0.45);

            pointer-events: none;
            will-change: opacity;
        }

        .scroll-line {
            width: 1px;
            height: 35px;

            background: rgba(255, 255, 255, 0.75);

            animation:
                scrollPulse 1.8s ease-in-out infinite;

            transform-origin: top;
        }

        @keyframes scrollPulse {
            0%,
            100% {
                transform: scaleY(0.35);
                opacity: 0.3;
            }

            50% {
                transform: scaleY(1);
                opacity: 1;
            }
        }

        .ending-space {
            min-height: 35vh;
            background: var(--white);
        }

        @media (max-width: 700px) {
            .scroll-intro {
                height: 235vh;
            }

            .original-page {
                padding: 40px 22px;
            }

            .avante-logo {
                width: min(420px, 84vw);
                max-height: 170px;
                margin-bottom: 28px;
            }

            .paragraph {
                font-size: clamp(20px, 6vw, 27px);
            }

            .email {
                margin-top: 36px;
                font-size: 12px;
            }

            .hero-image {
                width: 94vw;
                height: 94vw;
                max-height: 80vh;
            }

            .scroll-message {
                bottom: 16px;
            }

            .scroll-line {
                height: 28px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .scroll-line {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main>

        <section class="scroll-intro" id="scrollIntro">

            <div class="scene">

                <!-- White Avante page -->
                <div class="original-page" id="originalPage">

                    <div class="page-content">

                        <!--
                            This image replaces the written
                            "Avante CEIC" heading.
                        -->
                        <img
                            class="avante-logo"
                            src="your-image.png"
                            alt="Avante CEIC"
                        >

                        <p class="paragraph">
                            <span class="highlight">
                                Avante CEIC Limited
                            </span>
                            is a privately owned investment holding
                            company focused on long-term investments
                            that enhance lives and drive sustainable
                            development across emerging markets.
                        </p>

                        <a
                            class="email"
                            href="mailto:info@avanteceic.com"
                        >
                            info@avanteceic.com
                        </a>

                    </div>

                </div>

                <!-- Full-screen Great Zimbabwe opening -->
                <div
                    class="opening-visual"
                    id="openingVisual"
                >

                    <img
                        class="hero-image"
                        id="heroImage"
                        src="great-zimbabwe.png"
                        alt="Great Zimbabwe illustration"
                    >

                    <div
                        class="scroll-message"
                        id="scrollMessage"
                    >
                        <span>Scroll to enter</span>
                        <span class="scroll-line"></span>
                    </div>

                </div>

            </div>

        </section>

        <div class="ending-space"></div>

    </main>

    <script>
        const scrollIntro =
            document.getElementById("scrollIntro");

        const openingVisual =
            document.getElementById("openingVisual");

        const heroImage =
            document.getElementById("heroImage");

        const originalPage =
            document.getElementById("originalPage");

        const scrollMessage =
            document.getElementById("scrollMessage");

        function clamp(value, minimum, maximum) {
            return Math.min(
                Math.max(value, minimum),
                maximum
            );
        }

        function mapRange(
            value,
            inputMinimum,
            inputMaximum,
            outputMinimum,
            outputMaximum
        ) {
            const percentage =
                (value - inputMinimum) /
                (inputMaximum - inputMinimum);

            const mapped =
                outputMinimum +
                percentage *
                (outputMaximum - outputMinimum);

            return clamp(
                mapped,
                Math.min(outputMinimum, outputMaximum),
                Math.max(outputMinimum, outputMaximum)
            );
        }

        function easeInOut(value) {
            return value < 0.5
                ? 4 * value * value * value
                : 1 -
                    Math.pow(-2 * value + 2, 3) / 2;
        }

        function updateAnimation() {
            const scrollDistance =
                scrollIntro.offsetHeight -
                window.innerHeight;

            const distanceScrolled =
                window.scrollY -
                scrollIntro.offsetTop;

            const progress = clamp(
                distanceScrolled / scrollDistance,
                0,
                1
            );

            /*
             * Keep the full image visible briefly,
             * then begin shrinking it.
             */
            const shrinkProgress = easeInOut(
                mapRange(
                    progress,
                    0.08,
                    0.72,
                    0,
                    1
                )
            );

            const imageScale =
                1 - shrinkProgress * 0.76;

            const imageY =
                mapRange(
                    progress,
                    0.08,
                    0.72,
                    0,
                    -5
                );

            heroImage.style.transform = `
                translate(-50%, -50%)
                translateY(${imageY}vh)
                scale(${imageScale})
            `;

            /*
             * Fade out the complete blue opening layer.
             */
            const openingOpacity =
                mapRange(
                    progress,
                    0.48,
                    0.82,
                    1,
                    0
                );

            openingVisual.style.opacity =
                openingOpacity;

            /*
             * Reveal the white Avante page.
             */
            const pageOpacity =
                mapRange(
                    progress,
                    0.52,
                    0.84,
                    0,
                    1
                );

            const pageY =
                mapRange(
                    progress,
                    0.52,
                    0.84,
                    55,
                    0
                );

            originalPage.style.opacity =
                pageOpacity;

            originalPage.style.transform =
                `translateY(${pageY}px)`;

            /*
             * Hide "Scroll to enter" once scrolling begins.
             */
            const messageOpacity =
                mapRange(
                    progress,
                    0,
                    0.14,
                    1,
                    0
                );

            scrollMessage.style.opacity =
                messageOpacity;

            /*
             * Prevent hidden layers from blocking the email link.
             */
            openingVisual.style.pointerEvents =
                progress > 0.82
                    ? "none"
                    : "auto";

            originalPage.style.pointerEvents =
                progress > 0.72
                    ? "auto"
                    : "none";
        }

        let frameRequested = false;

        function requestAnimationUpdate() {
            if (frameRequested) {
                return;
            }

            frameRequested = true;

            window.requestAnimationFrame(() => {
                updateAnimation();
                frameRequested = false;
            });
        }

        window.addEventListener(
            "scroll",
            requestAnimationUpdate,
            { passive: true }
        );

        window.addEventListener(
            "resize",
            requestAnimationUpdate
        );

        updateAnimation();
    </script>

</body>
</html>
