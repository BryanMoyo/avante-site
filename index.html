<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avante CEIC</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --blue: #003f88;
            --deep-blue: #002f6c;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--blue);
            color: var(--white);
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(255, 255, 255, 0.08),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    var(--deep-blue),
                    var(--blue)
                );
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero::before {
            width: 650px;
            height: 650px;
            top: -320px;
            right: -240px;
        }

        .hero::after {
            width: 420px;
            height: 420px;
            bottom: -250px;
            left: -170px;
        }

        .hero-content {
            width: min(1200px, 100%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 70px;
            position: relative;
            z-index: 2;
        }

        .copy {
            opacity: 0;
            transform: translateY(40px);
            animation: revealCopy 1.1s ease forwards;
            animation-delay: 0.25s;
        }

        .eyebrow {
            margin: 0 0 20px;
            font-family: "Montserrat", sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            opacity: 0.75;
        }

        h1 {
            max-width: 650px;
            margin: 0;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(56px, 7vw, 105px);
            font-weight: 400;
            line-height: 0.92;
            letter-spacing: -0.04em;
        }

        .description {
            max-width: 590px;
            margin: 32px 0 0;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(20px, 2vw, 27px);
            font-weight: 300;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.84);
        }

        .description strong {
            color: var(--white);
            font-weight: 600;
        }

        .contact {
            display: inline-block;
            margin-top: 42px;
            font-family: "Montserrat", sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--white);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.55);
            padding-bottom: 7px;
            transition:
                opacity 0.3s ease,
                padding-bottom 0.3s ease;
        }

        .contact:hover {
            opacity: 0.7;
            padding-bottom: 11px;
        }

        .emblem-wrap {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.84) rotate(-3deg);
            animation: revealEmblem 1.4s cubic-bezier(.16, 1, .3, 1) forwards;
            animation-delay: 0.15s;
        }

        .emblem-wrap::before {
            content: "";
            position: absolute;
            width: 82%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.09);
            filter: blur(35px);
            animation: pulse 5s ease-in-out infinite;
        }

        .emblem {
            width: min(100%, 620px);
            height: auto;
            display: block;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.18));
            animation: float 6s ease-in-out infinite;
        }

        .scroll-label {
            position: absolute;
            left: 24px;
            bottom: 28px;
            font-family: "Montserrat", sans-serif;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            writing-mode: vertical-rl;
        }

        @keyframes revealCopy {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes revealEmblem {
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-14px);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(0.95);
                opacity: 0.65;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        @media (max-width: 850px) {
            .hero {
                min-height: auto;
                padding: 90px 24px 70px;
            }

            .hero-content {
                grid-template-columns: 1fr;
                gap: 46px;
                text-align: center;
            }

            .copy {
                order: 2;
            }

            .emblem-wrap {
                order: 1;
            }

            .emblem {
                width: min(90vw, 480px);
            }

            h1,
            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .scroll-label {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

<section class="hero">

    <div class="hero-content">

        <div class="copy">
            <p class="eyebrow">Investment Holding Company</p>

            <h1>Avante CEIC</h1>

            <p class="description">
                <strong>Avante CEIC Limited</strong> is a privately owned
                investment holding company focused on long-term investments
                that enhance lives and drive sustainable development across
                emerging markets.
            </p>

            <a class="contact" href="mailto:info@avanteceic.com">
                info@avanteceic.com
            </a>
        </div>

        <div class="emblem-wrap">
            <img
                class="emblem"
                src="great-zimbabwe.png"
                alt="Great Zimbabwe emblem"
            >
        </div>

    </div>

    <span class="scroll-label">Avante CEIC Limited</span>

</section>

<script>
    const emblem = document.querySelector(".emblem");

    window.addEventListener("mousemove", function (event) {
        if (window.innerWidth <= 850) return;

        const x = (event.clientX / window.innerWidth - 0.5) * 12;
        const y = (event.clientY / window.innerHeight - 0.5) * 12;

        emblem.style.transform =
            `translate3d(${x}px, ${y}px, 0)`;
    });

    window.addEventListener("mouseleave", function () {
        emblem.style.transform = "translate3d(0, 0, 0)";
    });
</script>

</body>
</html>
